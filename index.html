<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የእንግሊዘኛ ማስተካከያ AI</title>
    
    <style>
        /* ለአጠቃላይ ገጹ የተደረገ ቅንብር */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* በሞባይል ላይ ሙሉ ስክሪን እንዲይዝ የሚያደርግ */
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            padding: 15px 10px 5px 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #777;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        /* መልእክቶች የሚቀመጡበት ክፍል */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #f9f9f9;
        }

        /* የጋራ የመልእክት ስታይል */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        /* የ AI መልእክት (ግራ ጎን) */
        .ai-message {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* ያንተ መልእክት (ቀኝ ጎን) */
        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* በታች በኩል ያለው መጻፊያ ክፍል */
        .input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
            background-color: #ffffff;
            border-top: 1px solid #eee;
        }

        #userInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        #userInput:focus {
            border-color: #007bff;
        }

        #sendBtn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #sendBtn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>English AI Corrector</h2>
        <p class="subtitle">ጽሑፍህን እዚህ አስገባና ስህተቱን ያስተካክልልህ!</p>

        <div class="chat-box" id="chatBox">
            <div class="message ai-message">
                Hello! Write any English sentence, and I will correct it for you.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="እዚህ ላይ የእንግሊዘኛ ጽሑፍ ይጻፉ...">
            <button id="sendBtn">ላክ</button>
        </div>
    </div>

    <!-- አዲሱ የ JavaScript (JS) ክፍል እዚህ ይጀምራል -->
    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // መልእክት ለመላክ የምንጠቀምበት ፈንክሽን
        function sendMessage() {
            const messageText = userInput.value.trim();
            if (messageText === '') return; // ባዶ ከሆነ ምንም አያደርግም

            // 1. ያንተን መልእክት በገጹ ላይ ማሳየት
            appendMessage(messageText, 'user-message');
            userInput.value = ''; // መጻፊያ ሳጥኑን ባዶ ማድረግ

            // 2. AIው መልእክትህን እየተቀበለ እንደሆነ "Typing..." ማሳየት
            const loadingId = appendMessage("Thinking...", 'ai-message');

            // 3. ወደፊት ከ Python (Backend) ጋር ስናገናኘው እውነተኛ ምላሽ ይመጣል፤ 
            // ለአሁኑ ግን በጊዜያዊነት ከ2 ሰከንድ በኋላ ምላሽ እንዲሰጥ እናድርገው፡
            setTimeout(() => {
                // የ "Thinking..." መልእክቱን ማጥፋት
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();

                // የ AI ጊዜያዊ መልእክት
                const aiResponse = `Your text was received! Once we set up Python, I will strictly correct: "${messageText}"`;
                appendMessage(aiResponse, 'ai-message');
            }, 2000);
        }

        // መልእክቶችን ወደ ቻት ሳጥኑ የሚጨምር ፈንክሽን
        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', className);
            messageDiv.innerText = text;
            
            // ለጊዜያዊ መልእክት መለያ ID መስጠት
            const uniqueId = 'msg-' + Date.now();
            messageDiv.setAttribute('id', uniqueId);

            chatBox.appendChild(messageDiv);
            
            // አዳዲስ መልእክቶች ሲመጡ ቻቱን ወደ ታች አውቶማቲክ ማውረድ (Scroll)
            chatBox.scrollTop = chatBox.scrollHeight;

            return uniqueId;
        }

        // "ላክ" ቁልፍ ሲጫን
        sendBtn.addEventListener('click', sendMessage);

        // በኪቦርድ "Enter" ሲጫን እንዲልክ ማድረግ
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>

</body>
</html>
